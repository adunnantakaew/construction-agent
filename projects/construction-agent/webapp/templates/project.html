<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Agent — รายละเอียดโครงการ</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #262b36; --text: #e8eaed;
    --muted: #8a909c; --accent: #4f8cff; --danger: #e5484d; --warn: #e0a72e; --ok: #35c46a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
  }
  header { padding: 18px 28px; border-bottom: 1px solid var(--border); }
  header a.back { color: var(--muted); font-size: 12.5px; text-decoration: none; }
  header h1 { margin: 6px 0 2px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 20px 28px; max-width: 1100px; margin: 0 auto; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat .v { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .section { margin-bottom: 26px; }
  .section h2 { font-size: 15px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.overdue td { color: var(--danger); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .badge.planned { background: rgba(138,144,156,.15); color: var(--muted); }
  .badge.in_progress { background: rgba(79,140,255,.15); color: var(--accent); }
  .badge.reported_done { background: rgba(224,167,46,.15); color: var(--warn); }
  .badge.verified_done { background: rgba(53,196,106,.15); color: var(--ok); }
  .badge.blocked { background: rgba(229,72,77,.15); color: var(--danger); }
  .qc { font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
  .note {
    margin-top: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: rgba(224,167,46,.06); color: var(--muted); font-size: 12px; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
  <a class="back" href="/">&larr; กลับภาพรวม</a>
  <h1 id="title">กำลังโหลด...</h1>
  <p id="sub"></p>
</header>
<main>
  <div class="row" id="stats"></div>
  <div class="section">
    <h2>🕐 รายงานรอตรวจ (SE/OP ต้องยืนยัน)</h2>
    <div id="pending"></div>
  </div>
  <div class="section">
    <h2>⚠️ Defects เปิดอยู่ / Issues ค้าง</h2>
    <div id="issues"></div>
  </div>
  <div class="section">
    <h2>📋 รายการงานทั้งหมด (ตามลำดับ WBS)</h2>
    <table>
      <thead><tr><th>งาน</th><th>หมวด</th><th>แผนเริ่ม</th><th>แผนจบ</th><th>สถานะ</th></tr></thead>
      <tbody id="tasks"><tr><td colspan="5" class="loading">กำลังโหลด...</td></tr></tbody>
    </table>
  </div>
  <div class="note">
    ⚠️ วันที่แผนงานเป็นค่าประมาณการ (interpolated) จาก milestone สีในไฟล์ WBS ต้นฉบับ ยังไม่ใช่ duration ยืนยันจาก SE
  </div>
</main>
<script>
const pid = location.pathname.split('/').pop();
const statusLabel = {
  planned: 'วางแผน', in_progress: 'กำลังทำ', reported_done: 'รายงานแล้ว (รอตรวจ)',
  verified_done: 'ยืนยันเสร็จ', blocked: 'ติดขัด'
};

async function load() {
  const res = await fetch(`/api/project/${pid}`);
  if (!res.ok) { document.getElementById('title').textContent = 'ไม่พบโครงการ'; return; }
  const { today, project: p } = await res.json();

  document.getElementById('title').textContent = p.project_code;
  document.getElementById('sub').textContent =
    `ลูกค้า ${p.customer_name || '-'} · สถานะ ${p.stage} · บ้าน${p.house_type === '1_floor' ? ' 1 ชั้น' : p.house_type === '2_floor' ? ' 2 ชั้น' : ''} · ${p.location || ''} · ข้อมูล ณ ${today}`;

  const stats = document.getElementById('stats');
  stats.innerHTML = `
    <div class="stat"><div class="v">${p.done_tasks}/${p.total_tasks}</div><div class="l">งานยืนยันเสร็จ (${p.progress_pct}%)</div></div>
    <div class="stat"><div class="v">${p.overdue_count}</div><div class="l">งานเลยกำหนด (ตามแผนประมาณการ)</div></div>
    <div class="stat"><div class="v">${p.pending_review.length}</div><div class="l">รายงานรอตรวจ</div></div>
    <div class="stat"><div class="v qc">${p.next_qc ? p.next_qc.task_name : '-'}</div><div class="l">QC ถัดไป ${p.next_qc ? '(' + (p.next_qc.planned_end||'-') + ')' : ''}</div></div>
  `;

  const pendingEl = document.getElementById('pending');
  if (p.pending_review.length === 0) {
    pendingEl.innerHTML = '<div class="empty">ไม่มีรายงานค้างตรวจ</div>';
  } else {
    pendingEl.innerHTML = '<table><thead><tr><th>วันที่รายงาน</th><th>ผู้รายงาน</th><th>ข้อความ</th><th>สถานะเสนอ</th></tr></thead><tbody>' +
      p.pending_review.map(u => `<tr><td>${u.reported_date||'-'}</td><td>${u.reported_by||'-'}</td><td>${u.raw_text||'-'}</td><td><span class="badge ${u.status_after}">${statusLabel[u.status_after]||u.status_after}</span></td></tr>`).join('') +
      '</tbody></table>';
  }

  const issuesEl = document.getElementById('issues');
  const defectRows = p.open_defects.map(d => `<tr><td>Defect</td><td>${d.description||'-'}</td><td>${d.severity||'-'}</td><td>${d.status}</td></tr>`).join('');
  const issueRows = p.open_issues.map(i => `<tr><td>Issue</td><td>${i.description||'-'}</td><td>${i.owner_id||'-'}</td><td>กำหนด ${i.due_date||'-'}</td></tr>`).join('');
  if (!defectRows && !issueRows) {
    issuesEl.innerHTML = '<div class="empty">ไม่มี defect หรือ issue ค้างอยู่</div>';
  } else {
    issuesEl.innerHTML = '<table><thead><tr><th>ประเภท</th><th>รายละเอียด</th><th>ผู้รับผิดชอบ/ความรุนแรง</th><th>สถานะ</th></tr></thead><tbody>' + defectRows + issueRows + '</tbody></table>';
  }

  const tbody = document.getElementById('tasks');
  tbody.innerHTML = p.tasks.map(t => {
    const isOverdue = t.status !== 'verified_done' && t.planned_end && t.planned_end < today;
    const name = t.qc_gate ? `🔍 ${t.task_name}` : t.task_name;
    return `<tr class="${isOverdue ? 'overdue' : ''}">
      <td>${name}</td><td>${t.phase||'-'}</td><td>${t.planned_start||'-'}</td><td>${t.planned_end||'-'}</td>
      <td><span class="badge ${t.status}">${statusLabel[t.status]||t.status}</span></td>
    </tr>`;
  }).join('');
}
load();
</script>
</body>
</html>
